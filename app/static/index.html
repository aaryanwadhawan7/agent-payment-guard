<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Payment Guard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Agent Payment Guard</h1>
        <div class="sub">Every AI-agent payment is checked before PayPal sees it.</div>
      </div>
      <div id="auth">
        <form id="login-form" class="login">
          <input id="token" class="token" type="password" placeholder="Admin token" autocomplete="current-password">
          <button class="btn approve" type="submit">Sign in</button>
        </form>
        <div id="admin-bar" class="login" hidden>
          <span class="pill green">Admin signed in</span>
          <button id="logout" class="btn reject" type="button">Sign out</button>
        </div>
      </div>
    </header>

    <section class="cards">
      <div class="card">
        <div class="label">Paid</div>
        <div class="value" id="paid-n">0</div>
        <div class="money" id="paid-m"></div>
      </div>
      <div class="card">
        <div class="label">Awaiting approval</div>
        <div class="value" id="pending-n">0</div>
        <div class="money" id="pending-m"></div>
      </div>
      <div class="card">
        <div class="label">Blocked / rejected</div>
        <div class="value" id="blocked-n">0</div>
        <div class="money" id="blocked-m"></div>
      </div>
      <div class="card">
        <div class="label">Money protected</div>
        <div class="value" id="protected-m">$0</div>
        <div class="money">blocked + rejected</div>
      </div>
    </section>

    <section class="lab">
      <div class="lab-head">
        <h2>Demo lab</h2>
        <span class="hint">An AI agent reads an invoice and tries to pay it.</span>
      </div>
      <div class="lab-controls">
        <select id="lab-scenario">
          <option value="legit">Legit invoice</option>
          <option value="tampered">Tampered invoice (changed bank details)</option>
          <option value="injection">Hidden prompt injection</option>
          <option value="new_vendor">New vendor (needs a human)</option>
        </select>
        <select id="lab-mode">
          <option value="unprotected">Without the guard (simulated)</option>
          <option value="protected">Through the guard</option>
        </select>
        <button id="lab-run" class="btn approve" type="button">Run agent</button>
      </div>
      <div id="lab-out" hidden>
        <pre id="lab-invoice"></pre>
        <div id="lab-headline" class="lab-headline"></div>
        <div id="lab-agent" class="hint"></div>
        <div id="lab-reasons" class="hint"></div>
      </div>
    </section>

    <div id="grid" class="ag-theme-quartz"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
  <script src="/static/app.js"></script>
</body>

</html>
